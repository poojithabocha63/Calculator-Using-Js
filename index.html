<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">

  <div id="display" class="screen">Result will appear here</div>

  <input type="number" id="num1" placeholder="Enter first number">
  <input type="number" id="num2" placeholder="Enter second number">

  <div class="buttons">
    <button onclick="add(event)">+</button>
    <button onclick="sub(event)">-</button>
    <button onclick="multi(event)">*</button>
    <button onclick="divi(event)">/</button>
    <button onclick="modulus(event)">%</button>
    <button onclick="power(event)">^</button>
  </div>

</div>

<script src="script.js"></script>
</body> 
</html>
